services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: greenserve
      POSTGRES_PASSWORD: greenserve
      POSTGRES_DB: greenserve
    ports:
      - "5432:5432"
    volumes:
      - greenserve_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenserve -d greenserve"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  greenserve_postgres:
